[package]
name = "ldgr-ffi"
description = "UniFFI bindings for ldgr-core — zero-knowledge bookkeeping"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[lib]
crate-type = ["cdylib", "staticlib", "lib"]
name = "ldgr_ffi"

[dependencies]
ldgr-core = { path = "../ldgr-core", features = ["full"] }
uniffi.workspace = true
async-trait.workspace = true
futures.workspace = true
uuid.workspace = true
rust_decimal.workspace = true
thiserror.workspace = true
chrono.workspace = true
zeroize.workspace = true

# At-rest encryption for the iOS/FFI working store (issue #315): the keyed
# `PRAGMA key` open only encrypts when rusqlite is built with SQLCipher — plain
# SQLite treats `PRAGMA key` as a silent no-op and would write plaintext. The
# SQLCipher feature uses rusqlite's vendored OpenSSL, but `openssl-src` cannot
# configure OpenSSL for watchOS ("don't know how to configure OpenSSL for
# aarch64-apple-watchos"), so the feature is scoped to every target EXCEPT
# watchOS. This is safe: the watchOS app links only `LdgrShared` (pre-computed
# summaries over WatchConnectivity) and never opens a vault database, so it needs
# neither SQLCipher nor at-rest encryption. Each `cargo build --target` selects
# exactly one table below, so their features never unify across a device vs.
# watch build.
[target.'cfg(not(target_os = "watchos"))'.dependencies]
rusqlite = { workspace = true, features = ["bundled-sqlcipher-vendored-openssl"] }

[target.'cfg(target_os = "watchos")'.dependencies]
rusqlite = { workspace = true, features = ["bundled"] }

[build-dependencies]
uniffi = { workspace = true, features = ["build"] }

[dev-dependencies]
tempfile = "3"

[lints.rust]
# UniFFI scaffolding requires #[unsafe(no_mangle)] for FFI symbol exports
unsafe_code = "allow"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
must_use_candidate = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
similar_names = "allow"
